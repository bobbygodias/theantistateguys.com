name: Fix compact wide hitboxes

on:
  push:
    branches: [scenic-v2]
    paths:
      - FIX-COMPACT-WIDE-HITBOXES

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scenic-v2
          fetch-depth: 0
      - run: python scripts/fix_compact_wide_hitboxes.py
      - run: |
          git config user.name "Bobby Dias - O Capitão"
          git config user.email "renatogodias@gmail.com"
          git add responsive-home.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: enlarge compact wide player hitboxes"
            git push origin HEAD:scenic-v2
          fi
