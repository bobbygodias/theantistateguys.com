name: Hotfix tablet home and photo credit

on:
  push:
    branches: [scenic-v2]
    paths:
      - HOTFIX-TABLET-CREDIT

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: scenic-v2
          fetch-depth: 0

      - name: Patch scenic-v2 and main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bobby Dias - O Capitão"
          git config user.email "renatogodias@gmail.com"
          cp scripts/hotfix_tablet_credit.py /tmp/hotfix_tablet_credit.py

          patch_branch () {
            branch="$1"
            git checkout "$branch"
            git pull --ff-only origin "$branch"
            python /tmp/hotfix_tablet_credit.py
            git add index.html scenic-fixes.css
            if git diff --cached --quiet; then
              echo "$branch already patched"
            else
              git commit -m "fix: preserve scenic Home on tablets and correct photo credit"
              git push origin "$branch"
            fi
          }

          patch_branch scenic-v2
          git fetch origin main
          git checkout -B main origin/main
          patch_branch main
