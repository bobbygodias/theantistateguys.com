name: QA scenic v2

on:
  push:
    branches: [scenic-v2]
    paths:
      - QA-SCENIC

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scenic-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Start local site and run QA
        run: |
          python3 -m http.server 4173 >/tmp/tasg-http.log 2>&1 &
          sleep 2
          node .github/qa-scenic.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenic-v2-screenshots
          path: qa-screenshots/
          if-no-files-found: error
