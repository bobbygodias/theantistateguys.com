name: Tune responsive Home crop

on:
  push:
    branches: [scenic-v2]
    paths:
      - RESPONSIVE-HOME-TUNE

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scenic-v2
          fetch-depth: 0
      - run: python scripts/tune_responsive_home.py
      - run: |
          git config user.name "Bobby Dias - O Capitão"
          git config user.email "renatogodias@gmail.com"
          git add responsive-home.css
          if git diff --cached --quiet; then
            echo "Already tuned"
          else
            git commit -m "fix: crop vertical scenic Home background"
            git push origin HEAD:scenic-v2
          fi
