name: Apply history scenic pass

on:
  push:
    branches:
      - scenic-v2
    paths:
      - HISTORY-V3-GO

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scenic-v2
          fetch-depth: 0
      - name: Apply History CSS
        run: python3 scripts/apply_history_v3.py
      - name: Trigger visual QA
        run: echo "history-v3-$(date -u +%Y%m%dT%H%M%SZ)" > QA-SCENIC-GO
      - name: Commit changes
        run: |
          git config user.name "Bobby Dias - O Capitão"
          git config user.email "renatogodias@gmail.com"
          git add scenic-fixes.css QA-SCENIC-GO
          git commit -m "design: make History part of the scenic world"
          git push origin HEAD:scenic-v2
