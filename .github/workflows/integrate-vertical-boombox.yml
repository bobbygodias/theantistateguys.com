name: Integrate vertical boombox

on:
  push:
    branches: [scenic-v2]
    paths:
      - INTEGRATE-VERTICAL-BOOMBOX

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scenic-v2
          fetch-depth: 0
      - run: python scripts/integrate_vertical_boombox.py
      - run: |
          git config user.name "Bobby Dias - O Capitão"
          git config user.email "renatogodias@gmail.com"
          git add responsive-home.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: integrate vertical boombox into scenic alley"
            git push origin HEAD:scenic-v2
          fi
