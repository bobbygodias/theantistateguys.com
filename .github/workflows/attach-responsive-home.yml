name: Attach responsive Home stylesheet

on:
  push:
    branches: [scenic-v2]
    paths:
      - RESPONSIVE-HOME-GO

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scenic-v2
          fetch-depth: 0
      - run: python scripts/attach_responsive_home.py
      - run: |
          git config user.name "Bobby Dias - O Capitão"
          git config user.email "renatogodias@gmail.com"
          git add history-v5.css
          if git diff --cached --quiet; then
            echo "Already attached"
          else
            git commit -m "feat: attach scenic responsive Home art direction"
            git push origin HEAD:scenic-v2
          fi
