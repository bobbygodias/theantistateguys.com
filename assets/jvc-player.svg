<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">JVC boombox</title>
  <desc id="desc">Ilustração vetorial transparente de um rádio cassete JVC de estética anos 1980.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292a28"/><stop offset=".18" stop-color="#151615"/><stop offset=".68" stop-color="#20211f"/><stop offset="1" stop-color="#0c0d0c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#565751"/><stop offset=".18" stop-color="#20211f"/><stop offset=".52" stop-color="#6a6b64"/><stop offset=".78" stop-color="#242521"/><stop offset="1" stop-color="#4c4d47"/>
    </linearGradient>
    <linearGradient id="tuner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16130d"/><stop offset=".52" stop-color="#332515"/><stop offset="1" stop-color="#15110c"/>
    </linearGradient>
    <radialGradient id="speaker">
      <stop offset="0" stop-color="#1b1c1a"/><stop offset=".46" stop-color="#090a09"/><stop offset=".82" stop-color="#1a1b19"/><stop offset="1" stop-color="#050605"/>
    </radialGradient>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.35" fill="#343530"/><circle cx="9" cy="9" r="1.35" fill="#343530"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- handle -->
    <path d="M208 137V78q0-26 26-26h532q26 0 26 26v59h-42V96H250v41z" fill="#111210" stroke="#55564f" stroke-width="9"/>
    <rect x="262" y="67" width="476" height="19" rx="7" fill="url(#metal)" opacity=".88"/>

    <!-- top deck -->
    <path d="M140 132h720l40 43v366q0 28-28 28H128q-28 0-28-28V175z" fill="url(#body)" stroke="#090a09" stroke-width="14"/>
    <path d="M117 181h766" stroke="#5a5b54" stroke-width="5" opacity=".6"/>

    <!-- upper controls -->
    <g fill="#090a09" stroke="#5a5b54" stroke-width="4">
      <rect x="155" y="151" width="54" height="28" rx="5"/><rect x="220" y="151" width="54" height="28" rx="5"/>
      <rect x="285" y="151" width="54" height="28" rx="5"/><rect x="350" y="151" width="54" height="28" rx="5"/>
      <rect x="415" y="151" width="54" height="28" rx="5"/><rect x="480" y="151" width="54" height="28" rx="5"/>
    </g>
    <circle cx="781" cy="163" r="22" fill="#10110f" stroke="#77786f" stroke-width="5"/>
    <circle cx="842" cy="163" r="17" fill="#10110f" stroke="#77786f" stroke-width="5"/>

    <!-- branding -->
    <text x="142" y="231" fill="#d9d6cb" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="43" letter-spacing="-3">JVC</text>
    <text x="224" y="225" fill="#8d8b80" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">STEREO RADIO CASSETTE RECORDER</text>

    <!-- tuner window -->
    <rect x="138" y="245" width="724" height="75" rx="8" fill="url(#tuner)" stroke="#6b6658" stroke-width="5"/>
    <g stroke="#c1a36d" opacity=".7">
      <path d="M164 271h674" stroke-width="2"/>
      <path d="M174 259v23m45-23v17m45-17v23m45-23v17m45-17v23m45-23v17m45-17v23m45-23v17m45-17v23m45-23v17m45-17v23m45-23v17m45-17v23m45-23v17m45-17v23m45-23v17"/>
    </g>
    <path d="M511 251v64" stroke="#d58a45" stroke-width="6"/>
    <text x="165" y="305" fill="#d1b27a" font-family="monospace" font-size="14">FM 88  92  96  100  104  108     AM 530  800  1200  1600</text>

    <!-- speaker bays -->
    <g>
      <circle cx="260" cy="444" r="132" fill="#090a09" stroke="#54554f" stroke-width="10"/>
      <circle cx="260" cy="444" r="111" fill="url(#speaker)" stroke="#272824" stroke-width="6"/>
      <circle cx="260" cy="444" r="103" fill="url(#mesh)" opacity=".75"/>
      <circle cx="260" cy="444" r="52" fill="#0d0e0d" stroke="#353631" stroke-width="7"/>
      <circle cx="740" cy="444" r="132" fill="#090a09" stroke="#54554f" stroke-width="10"/>
      <circle cx="740" cy="444" r="111" fill="url(#speaker)" stroke="#272824" stroke-width="6"/>
      <circle cx="740" cy="444" r="103" fill="url(#mesh)" opacity=".75"/>
      <circle cx="740" cy="444" r="52" fill="#0d0e0d" stroke="#353631" stroke-width="7"/>
    </g>

    <!-- center cassette deck -->
    <rect x="402" y="339" width="196" height="188" rx="9" fill="#171815" stroke="#65665f" stroke-width="8"/>
    <rect x="427" y="364" width="146" height="108" rx="6" fill="#090a09" stroke="#85867c" stroke-width="5"/>
    <path d="M447 388h106l-14 61h-78z" fill="#181915" stroke="#55564f" stroke-width="4"/>
    <circle cx="474" cy="420" r="17" fill="#070807" stroke="#77786f" stroke-width="4"/>
    <circle cx="526" cy="420" r="17" fill="#070807" stroke="#77786f" stroke-width="4"/>
    <rect x="441" y="487" width="118" height="20" rx="4" fill="#3b3c37"/>
    <text x="464" y="503" fill="#b7b3a5" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12" letter-spacing="2">CASSETTE</text>

    <!-- side vents and details -->
    <g fill="#0a0b0a" opacity=".9">
      <rect x="117" y="342" width="25" height="174" rx="4"/><rect x="858" y="342" width="25" height="174" rx="4"/>
    </g>
    <g stroke="#43443f" stroke-width="5" opacity=".7">
      <path d="M124 360h12m-12 19h12m-12 19h12m-12 19h12m-12 19h12m-12 19h12m-12 19h12m-12 19h12"/>
      <path d="M864 360h12m-12 19h12m-12 19h12m-12 19h12m-12 19h12m-12 19h12m-12 19h12m-12 19h12"/>
    </g>

    <!-- feet -->
    <path d="M151 565h104v30H140q-12 0-7-12zM745 565h104l18 18q5 12-7 12H745z" fill="#080908"/>
  </g>
</svg>
